[package]
name = "sfm-preview-spike"
version = "0.1.0"
edition = "2021"
description = "S0 spike: host the Windows registered IPreviewHandler for a file (e.g. .docx via WPS/Office)"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 2
